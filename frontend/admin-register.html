<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <title>Registrazione — Backoffice PPR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/src/apple.css" />
  </head>
  <body class="admin admin-login-page">
    <main class="admin-login-main">
      <div class="admin-login-card">
        <h1 class="admin-login-title">Registrazione</h1>
        <p class="admin-login-lead">Crea un account per accedere al backoffice.</p>
        <form id="register-form" class="admin-form">
          <div class="form-group">
            <label for="name">Nome</label>
            <input id="name" name="name" type="text" class="input" required autocomplete="name" />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" class="input" required autocomplete="email" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" class="input" required autocomplete="new-password" minlength="8" />
          </div>
          <div class="form-group">
            <label for="password_confirmation">Conferma password</label>
            <input id="password_confirmation" name="password_confirmation" type="password" class="input" required autocomplete="new-password" />
          </div>
          <p class="form-feedback" id="register-feedback" style="display:none;"></p>
          <button type="submit" class="btn btn-primary btn-block">Registrati</button>
        </form>
        <p class="admin-login-footer">
          Hai già un account? <a href="./admin-login.html">Accedi</a>
        </p>
      </div>
    </main>
    <script type="module" src="/src/admin-register.js"></script>
  </body>
</html>
